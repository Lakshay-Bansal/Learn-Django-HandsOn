{% extends 'main/base.html' %}

{% if submission_status %}
    <p>Form is submitted successfully....</p>
{% endif %}

{% block body %}
    <h1>Create New Article - What's on your Mind today</h1>

    <!-- We will take the data from user using the form -->
    <form action=" " method="POST">
        {% csrf_token %}
        <button type="reset">Reset</button>

        <input type="text" name="title" placeholder="Title">
        <textarea name="context" placeholder="Eassy"></textarea>
        <!-- Author can select from the list of avialable author at the site -->
        <select name="author">
            {% for athr in authors %}
                <option value="{{ athr.id }}">{{ athr.name }}</option>
            {% endfor %}
        </select>

        <button type="submit">Submit</button>
    </form>
{% endblock %}
