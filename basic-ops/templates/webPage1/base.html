<!-- base.html file is to reduce the line of code that has be written in index.html. 
    As some part of index.html for different webpages are same.
    Eg. Say the head portion of each webpage is same jsut a title name would be changed-->

{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Attendance System</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" >
        <link rel="stylesheet" type="text/css" media= "screen" href="{% static 'css/materialize.min.css' %}">
        <script src="{% static 'js/materialze.min.js' %}"></script>

        <!-- block is a Django template -->
        {% block head %} {% endblock %}
    </head>
    
    <body>
        {% block body %} {% endblock %}
    </body>
</html>
